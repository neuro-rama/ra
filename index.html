<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NeuroRA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>NeuroRA evaluation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>html,body{margin:0}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one compact thumb-reachable column on white; outlined cards; colour only from the three activity hues */
:root{
  --bg:#ffffff; --sheet:#ffffff; --ink:#111827; --muted:#5b6472; --line:#e5e7eb; --edge:#d3d8e0;
  --accent:#111827; --accent-ink:#ffffff; --soft:#f1f3f6;
  --low:#b4472f; --mid:#8a6a12; --high:#1f7a5f; --warn-bg:#fbe9e4;
  --c-jc:#a17a00; --c-topic:#1d4ed8; --c-clin:#0f766e; --b-jc:#fbf3d0; --b-topic:#e6edff; --b-clin:#dcf3ee;
  --body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Thonburi,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --sheet:#191c24; --ink:#f2f3f7; --muted:#a3a8b8; --line:#2a2e38; --edge:#3a404e;
  --accent:#f2f3f7; --accent-ink:#0f1115; --soft:#1e222b;
  --low:#f08a72; --mid:#e0bd5a; --high:#6fd0b0; --warn-bg:#3a2320;
  --c-jc:#f2c94c; --c-topic:#93b4ff; --c-clin:#6fdcc4; --b-jc:#3a3210; --b-topic:#1c2748; --b-clin:#12332e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --sheet:#191c24; --ink:#f2f3f7; --muted:#a3a8b8; --line:#2a2e38; --edge:#3a404e;
  --accent:#f2f3f7; --accent-ink:#0f1115; --soft:#1e222b;
  --low:#f08a72; --mid:#e0bd5a; --high:#6fd0b0; --warn-bg:#3a2320;
  --c-jc:#f2c94c; --c-topic:#93b4ff; --c-clin:#6fdcc4; --b-jc:#3a3210; --b-topic:#1c2748; --b-clin:#12332e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 96px;display:flex;flex-direction:column;gap:12px}
.ty-jc{--tc:var(--c-jc);--tb:var(--b-jc)}.ty-topic{--tc:var(--c-topic);--tb:var(--b-topic)}.ty-clin{--tc:var(--c-clin);--tb:var(--b-clin)}
h1{font-size:1.35rem;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:.88rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:5px;min-width:0}
input[type=text],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--edge);border-radius:10px;padding:9px 12px;width:100%;min-height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
label>input{box-sizing:border-box}
.chips.chips3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips.chips3 button{padding:0 4px;white-space:nowrap;min-height:44px}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:3px solid var(--tc,var(--accent));outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--edge);background:var(--sheet);color:var(--ink);min-height:44px;padding:0 14px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;border-radius:999px;min-height:48px;padding:0 22px}
.ghost{background:none;border:none;color:var(--ink);font-weight:600;padding:0 6px}
.small{min-height:36px;padding:0 10px;font-size:.86rem}
.danger{color:var(--low);border-color:var(--low)}
.okbtn{color:var(--high);border-color:var(--high);font-weight:600;white-space:nowrap}
.tn2{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--tc)}
.tn2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.nm{display:flex;flex-direction:column;min-width:0;flex:1;text-align:left}
.nm b{font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.chev{color:var(--muted);font-size:1.3rem;flex:none}
.n{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:grid;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:0 2px;font-size:.86rem;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tabs button[aria-current=true]{color:var(--tc,var(--ink));border-bottom-color:var(--tc,var(--ink));font-weight:700}
.badge{background:var(--low);color:#fff;border-radius:999px;font-family:var(--num);font-size:.72rem;font-weight:600;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.card{background:var(--sheet);border:1.5px solid var(--edge);border-radius:16px;box-shadow:0 2px 6px rgba(17,24,39,.07);padding:10px 12px;width:100%;height:auto;text-align:left}
button.card{display:flex;align-items:center;gap:10px}
.jobc{display:grid;grid-template-columns:44px minmax(0,1fr) 112px 10px;align-items:center;gap:10px}
.jobc .av{background:var(--tb);color:var(--tc)}
.jobc .nm .muted{font-family:var(--num);font-size:.8rem}
.typ{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.typ .tn2{font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;border-radius:999px}
.chips button[aria-pressed=true]{background:var(--tc,var(--accent));color:var(--accent-ink);border-color:var(--tc,var(--accent));font-weight:700}
.chips .tyb{color:var(--tc);border-color:var(--tc);font-weight:600}
.chips .tyb[aria-pressed=true]{color:var(--sheet)}
.fhead{background:var(--tb,var(--soft));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fhead .chips{gap:4px}
.fhead .chips button{min-height:34px;padding:0 8px;font-size:.82rem;white-space:nowrap}
.dd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.dd>div{display:flex;flex-direction:column;gap:5px}
.dd .chips button{min-height:44px}
.rog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.rog .muted{font-size:.78rem}
.inl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:flex;flex-direction:column;gap:4px;border-radius:10px}
.q{font-weight:600;font-size:.9rem}
.qd{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miss{background:var(--warn-bg);outline:2px solid var(--low);border-radius:10px;padding:6px 8px}
.need{color:var(--low);font-size:.78rem;font-weight:600;white-space:nowrap}
.slider{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 58px;gap:8px;align-items:center}
.slider button{padding:0;font-size:1.3rem;border-radius:50%;color:var(--tc)}
.slider output{font-family:var(--num);font-weight:600;text-align:right}
.slider input{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:44px;margin:0}
.slider input::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--tc) var(--p),var(--line) var(--p))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--tc);margin-top:-11px;border:3px solid var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.slider input::-moz-range-track{height:10px;border-radius:5px;background:var(--line)}
.slider input::-moz-range-progress{height:10px;border-radius:5px;background:var(--tc)}
.slider input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--tc);border:3px solid var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.slider{grid-template-columns:32px minmax(0,1fr) 32px;gap:6px}
.slider button{min-height:32px;height:32px;border:none;background:var(--soft);font-size:1.1rem;color:var(--ink)}
.slider input{height:32px}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.slider input::-webkit-slider-thumb{width:24px;height:24px;margin-top:-9px}
.slider input::-moz-range-track,.slider input::-moz-range-progress{height:6px}
.slider input::-moz-range-thumb{width:20px;height:20px}
.qb{border:none;background:none;padding:0;min-height:0;text-align:left;border-radius:4px}
.item output{font-size:1.05rem}
.item output small{font-size:.72rem;color:var(--muted);font-weight:500}
.qd{white-space:normal}
.item{gap:2px}
.s9{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.s9 button{padding:0;min-height:38px;font-family:var(--num);font-size:.92rem;border-radius:10px}
.s9 button:last-child{font-size:.66rem;font-family:var(--body)}
.s9 button[aria-pressed=true]{font-weight:700;border-color:transparent}
.s9 button.na[aria-pressed=true]{background:var(--muted);color:var(--sheet)}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;padding:0;min-height:36px;color:var(--muted);font-size:.86rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:648px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;min-width:0}
.bar .n{font-size:1.3rem}
.err{background:var(--warn-bg);color:var(--low);border-radius:10px;padding:9px 12px;font-weight:600}
.okb{background:var(--soft);color:var(--high);font-weight:700;border-radius:10px;padding:10px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.big{font-family:var(--num);font-size:2.4rem;line-height:1.1;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
dt{color:var(--muted)}dd{margin:0;font-family:var(--num);text-align:right}
.txt{white-space:pre-wrap}
hr{border:none;border-top:1px solid var(--line);margin:0;width:100%}
.code{font-family:var(--num);font-size:2rem;font-weight:600;letter-spacing:.3em;text-align:center;min-height:3rem;padding-left:.3em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;width:100%;margin:0 auto}
.pad button{min-height:56px;font-size:1.45rem;font-family:var(--num);border-radius:16px}
.pad .primary{font-family:var(--body);font-size:1.05rem}
.rcard{display:flex;flex-direction:column;gap:4px;cursor:pointer}
.rcard .tn2{font-size:.82rem}
.arow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding-top:8px;border-top:1px solid var(--line)}
.arow>span:first-child{min-width:0;flex:1;font-weight:600}
.pill{font-size:.84rem;color:var(--mid);white-space:nowrap}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tpick button{display:flex;align-items:center;gap:10px;text-align:left;height:auto;padding:7px 12px;border-radius:14px}
.tpick .av{width:38px;height:38px;font-size:1rem}
.tpick .tn{flex:1;min-width:0;font-weight:600}
.tpick .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.tpick button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.tpick button[aria-pressed=true] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:none;background:none;min-height:36px;border-radius:999px;padding:0 6px;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px}
.tcard[aria-pressed=true]{border-color:var(--tc);box-shadow:none}
.tcard .tn2{font-size:.72rem;gap:5px}
.tcard .tn2::before{width:7px;height:7px}
.tcard b{font-family:var(--num);font-size:1.5rem;line-height:1.2}
.tcard .of{font-size:.7rem;font-weight:500;color:var(--muted);margin-left:2px}
.tcard>span:last-child{font-size:.72rem;color:var(--muted)}
.pbox{display:flex;flex-direction:column;gap:10px;padding:14px}
.radar{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.radar .rl{font-size:12px;fill:var(--muted);font-family:var(--body)}
.radar .rv{font-size:13px;font-weight:600;fill:var(--ink);font-family:var(--num)}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:10px;align-items:center;font-size:.88rem}
.brow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:16px;border-radius:4px;background:var(--soft)}
.btrack i{display:block;height:100%;border-radius:4px;background:var(--tc);min-width:0}
.pcard{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.idrow{display:flex;align-items:center;gap:10px;min-width:0}
.idrow .av{width:38px;height:38px;font-size:1rem}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio>span{display:flex;flex-direction:column;min-width:0}
.trio .tn2{font-size:.72rem;gap:5px}
.trio .tn2::before{width:7px;height:7px}
.trio b{font-family:var(--num);font-size:1.1rem}
.trio small{font-size:.72rem;color:var(--muted)}
button.tcard{align-items:flex-start}
button.pcard{align-items:stretch}
.ty-clin .item .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips.hfc{flex-wrap:nowrap}.chips.hfc button{flex:1 1 auto;white-space:nowrap;min-width:0;padding-left:8px;padding-right:8px}
@media(max-width:350px){.chips.hfc button{font-size:.78rem;padding-left:5px;padding-right:5px}}
.jobc .typ{flex:0 0 max(30%,116px)}
#sv{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111827;color:#fff;font-size:.8rem;padding:7px 14px;border-radius:999px;z-index:50;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.jobc .typ>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jobc .typ>.tn2{overflow:visible}
.slider{grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;padding:4px 0}
.slider button{min-height:40px;height:40px;font-size:1.3rem}
.slider input{height:48px;cursor:pointer;touch-action:pan-y}
.slider input::-webkit-slider-runnable-track{height:16px;border-radius:8px}
.slider input::-webkit-slider-thumb{width:36px;height:36px;margin-top:-10px}
.slider input::-moz-range-track,.slider input::-moz-range-progress{height:16px;border-radius:8px}
.slider input::-moz-range-thumb{width:32px;height:32px}
select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--edge);border-radius:10px;padding:9px 12px;width:100%;min-height:44px}
.rog>div:first-child{grid-column:1/-1}
#sv{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px));font-size:.74rem;padding:5px 12px}
.slider{grid-template-columns:36px minmax(0,1fr) 36px;gap:10px;align-items:start;padding:0}
.slider button{min-height:36px;height:36px;margin-top:4px;border:1.5px solid var(--edge);background:var(--sheet);color:var(--ink);font-size:1.1rem;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.sw{display:flex;flex-direction:column;min-width:0}
.slider input{height:44px}
.slider input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--tc) var(--p),var(--soft) var(--p))}
.slider input::-webkit-slider-thumb{width:30px;height:30px;margin-top:-11px;background:var(--sheet);border:3px solid var(--tc);box-shadow:0 2px 6px rgba(17,24,39,.22)}
.slider input::-moz-range-track{height:8px;border-radius:4px;background:var(--soft)}
.slider input::-moz-range-progress{height:8px;border-radius:4px;background:var(--tc)}
.slider input::-moz-range-thumb{width:24px;height:24px;background:var(--sheet);border:3px solid var(--tc);box-shadow:0 2px 6px rgba(17,24,39,.22)}
.ticks{display:flex;justify-content:space-between;padding:0 15px;margin-top:-8px;font-family:var(--num);font-size:.66rem;color:var(--muted);pointer-events:none}
.ticks span{width:0;display:flex;justify-content:center}
.stp{display:flex;align-items:center;gap:12px;border:1.5px solid var(--edge);border-radius:14px;padding:6px 10px;background:var(--sheet)}
.stp button{width:44px;height:44px;min-height:44px;flex:none;padding:0;border-radius:50%;border:1.5px solid var(--tc);background:var(--sheet);color:var(--tc);font-size:1.4rem;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stp button:active{background:var(--soft)}
.stp .mid{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.stp .big{font-family:var(--num);font-weight:600;font-size:1.4rem;line-height:1.1}
.stp .big small{font-size:.72rem;color:var(--muted);font-weight:500}
.stp .hit{width:100%;height:30px;display:flex;align-items:center;touch-action:pan-y;cursor:pointer;margin-bottom:-6px;border-radius:6px}
.stp .sbar{width:100%;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.stp .sbar b{display:block;height:100%;background:var(--tc);border-radius:5px}
.rcard{align-items:stretch;min-width:0}
.rcard .top{min-width:0}
.rcard .top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app>.top .ghost{white-space:nowrap;flex:none}
#app>.top>div{min-width:0;flex:1}
#app>.top h1,#app>.top>div>.muted,#app>.top>.muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#app>.top>.muted{text-align:right;flex:1}
.rog>div{min-width:0}
.rog>div>div{overflow-wrap:anywhere;word-break:break-word}
.rog>div>div:last-child{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.col>div{min-width:0}
.txt{overflow-wrap:anywhere}
.trio{gap:0}
.trio>span{padding:0 8px}
.trio .tn2{white-space:nowrap}
@media(max-width:350px){.trio>span{padding:0 5px}.trio .tn2{font-size:.64rem;gap:4px}}
.trio>span:first-child{padding-left:0}
.trio>span+span{border-left:1px solid var(--line)}
#app.locked .stp,#app.locked .scale,#app.locked .fhead .chips,#app.locked textarea,#app.locked .fhead input{pointer-events:none;opacity:.6}
.lockn{font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
input,textarea,select{font-size:16px!important}
#app.v-login{min-height:100vh;min-height:100dvh;justify-content:center;padding-block:24px 48px;gap:0}
.v-login .lhead{text-align:center;margin-bottom:36px}
.v-login .lhead h1{font-size:clamp(1.45rem,7.6vw,1.9rem);white-space:nowrap;line-height:1.15;margin:0;letter-spacing:-.01em}
.v-login .lhead h1 span{font-weight:300;color:var(--muted)}
.v-login .lhead p{margin:4px 0 0}
.v-login .lcap{text-align:center;margin:0}
.v-login .code{margin:4px 0 22px;min-height:3.2rem;display:flex;align-items:center;justify-content:center}
.v-login .pad{gap:12px;max-width:300px}
.v-login .pad button{min-height:62px}
.v-login .err,.v-login [role=status]{margin:0 0 14px}
.v-login .nw{white-space:nowrap;display:inline-block}
.v-login .dig{gap:14px;letter-spacing:0;padding:0}
.v-login .dig span{width:22px;text-align:center}
.v-login .dig .e{color:var(--muted);font-family:var(--body);font-weight:400}
.hav{padding:0;border:0;background:none;min-height:0;flex:none;border-radius:50%;line-height:0}
.top>.hav .av{width:38px;height:38px;font-size:1rem}
.av.ph{padding:0;overflow:hidden;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.jobc .av.ph{box-shadow:0 0 0 2px var(--tc)}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:50}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--sheet);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:51;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 -6px 24px rgba(17,24,39,.15)}
.pfbig{display:flex;justify-content:center}.pfbig .av{width:112px;height:112px;font-size:2.6rem}
.sheet .muted{margin-bottom:6px}
#app.sw-l>*:not(.top):not(.tabs){animation:swl .22s ease-out}
#app.sw-r>*:not(.top):not(.tabs){animation:swr .22s ease-out}
@keyframes swl{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#app.sw-l>*,#app.sw-r>*{animation:none!important}}

 im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(w,h),cv=document.createElement("canvas");cv.width=cv.height=192;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,192,192);g.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,192,192);URL.revokeObjectURL(u);
  let q=.85,d=cv.toDataURL("image/jpeg",q);while(d.length>40000&&q>.35){q-=.1;d=cv.toDataURL("image/jpeg",q)}okImg(d)?ok(d):no()};
 im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
function setPhoto(c,img){const old=PH[c];if(img)PH[c]=img;else delete PH[c];S.pfErr="";
 if(!GAS){savePH();S.pf=null;keep();return}
 S.pfBusy=true;keep();
 call({code:S.me,action:"photo",target:c,img:img||""},45000).then(x=>{if(!x||!x.ok)throw 0;PHV=x.pv;savePH();S.pfBusy=false;S.pf=null;keep()})
  .catch(()=>{if(old)PH[c]=old;else delete PH[c];S.pfBusy=false;S.pfErr="บันทึกรูปไม่สำเร็จ กรุณาลองอีกครั้ง";keep()})}
document.addEventListener("change",e=>{if(e.target.id!=="pf-in"||!e.target.files||!e.target.files[0])return;const c=S.pf;
 shrink(e.target.files[0]).then(d=>setPhoto(c,d)).catch(()=>{S.pfErr="เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น";keep()})});
document.addEventListener("click",e=>{if(!S.pf||!e.target.closest)return;const t=e.target.closest("[data-pfx],[data-pfpick],[data-pfdel]");
 if(e.target.matches(".ov")||(t&&"pfx" in t.dataset)){if(S.pfBusy)return;S.pf=null;S.pfErr="";keep();return}
 if(!t)return;if("pfpick" in t.dataset){const i=document.getElementById("pf-in");if(i)i.click()}else if("pfdel" in t.dataset)setPhoto(S.pf,null)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.pf&&!S.pfBusy){S.pf=null;keep()}});
// ปัดซ้าย/ขวาเพื่อเปลี่ยน tab
const TABS={thome:["tab",["todo","self","hist","dash"]],ahome:["tab",["dash","hist","pend"]],rhome:["rtab",["list","me"]]};
let SW=null;
const hscroll=el=>{for(;el&&el!==document.body;el=el.parentElement){const o=getComputedStyle(el).overflowX;if((o==="auto"||o==="scroll")&&el.scrollWidth>el.clientWidth+2)return true}return false};
document.addEventListener("touchstart",e=>{SW=null;if(e.touches.length!==1||!TABS[S.view]||S.pf)return;const t=e.target;
 if(t.closest&&t.closest("input,textarea,select,[data-bar]"))return;if(hscroll(t))return;const p=e.touches[0];SW={x:p.clientX,y:p.clientY,t:Date.now()}},{passive:true});
document.addEventListener("touchend",e=>{if(!SW)return;const p=e.changedTouches[0],dx=p.clientX-SW.x,dy=p.clientY-SW.y,dt=Date.now()-SW.t;SW=null;
 if(dt>800||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;const T=TABS[S.view];if(!T)return;
 const L=T[1],i=L.indexOf(S[T[0]]),j=i+(dx<0?1:-1);if(i<0||j<0||j>=L.length)return;
 go(S.view,{[T[0]]:L[j]});const a=document.getElementById("app");a.classList.add(dx<0?"sw-l":"sw-r");setTimeout(()=>a.classList.remove("sw-l","sw-r"),300)},{passive:true});
function keep(){const y=scrollY;render();scrollTo(0,y)}
function key(k){if(S.view!=="login")return;
 if(k==="del"){S.code=S.code.slice(0,-1);S.err=""}
 else if(k==="ok"){if(S.busy)return;if(GAS){if(S.code){signin(S.code);return}}else if(role(S.code)){enter(S.code);return}
  if(0){S.me=S.code;ls.set("nra_me",S.me);S.code="";S.tab="todo";S.rtab="list";home();return}
  S.err=S.code?"ไม่พบรหัส "+S.code+" กรุณาตรวจสอบอีกครั้ง":"กรุณาใส่รหัสประจำตัว"}
 else if(S.code.length<MAXLEN){S.code+=k;S.err=""}
 render()}
function setScore(i,v){const d=S.draft;if(d.locked)return;const was=d.touched[i];d.scores[i]=Math.max(0,Math.min(20,v));d.touched[i]=true;
 if(S.err||(S.miss&&!was)){S.err="";keep();return}
 const o=document.getElementById("o-"+i);if(!o){keep();return}
 o.firstChild.textContent=d.scores[i];document.getElementById("b-"+i).style.width=d.scores[i]*5+"%";document.getElementById("sc-"+i).setAttribute("aria-valuenow",d.scores[i]);
 const t=total(S.type,d.scores);document.getElementById("tot").textContent=totalText(S.type,t);document.getElementById("lvl").textContent=level(S.type,t)||"คะแนนรวม"}
const bump=(i,dv)=>setScore(i,S.draft.touched[i]?S.draft.scores[i]+dv:15);
let HOLD=null,HELD=false;const unhold=()=>{clearTimeout(HOLD);clearInterval(HOLD);HOLD=null};
document.addEventListener("pointerdown",e=>{if(S.view!=="form"||!e.target.closest||(S.draft&&S.draft.locked))return;
 const b=e.target.closest("[data-step]");
 if(b){const i=+b.dataset.step,dv=+b.dataset.dv;HELD=false;unhold();HOLD=setTimeout(()=>{HELD=true;bump(i,dv);HOLD=setInterval(()=>bump(i,dv),90)},450);return}
 const h=e.target.closest("[data-bar]");if(!h)return;const i=+h.dataset.bar;
 const at=x=>{const el=document.getElementById("sc-"+i);if(!el)return;const r=el.getBoundingClientRect();setScore(i,Math.round((x-r.left)/r.width*20))};
 const x0=e.clientX;let drag=false;const off=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",off)},
  mv=ev=>{if(drag||Math.abs(ev.clientX-x0)>6){drag=true;at(ev.clientX)}},up=ev=>{at(ev.clientX);off()};
 addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",off)});
["pointerup","pointercancel"].forEach(t=>addEventListener(t,unhold,true));addEventListener("blur",e=>{if(e.target===window)unhold()});document.addEventListener("visibilitychange",unhold);
document.addEventListener("keydown",e=>{
 if(S.view==="form"&&e.target.dataset&&e.target.dataset.bar){const dv={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(dv){e.preventDefault();const i=+e.target.dataset.bar;bump(i,dv);const el=document.getElementById("sc-"+i);if(el)el.focus();return}}
 if(S.view==="login"){if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("del");else if(e.key==="Enter"){e.preventDefault();key("ok")}return}
 if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{const el=e.target,d=S.draft;
 if(el.dataset.nf&&S.nw){S.nw.f[el.dataset.nf]=el.value;return}
 if(el.dataset.n&&S.nw){S.nw[el.dataset.n]=el.value;return}
 if(!d)return;
 if(el.dataset.k)d[el.dataset.k]=el.value;if(el.dataset.f)d.f[el.dataset.f]=el.value;if(el.dataset.t)d.t[el.dataset.t]=el.value;
 if(el.dataset.sl){const i=+el.dataset.sl,was=d.touched[i];d.scores[i]=+el.value;d.touched[i]=true;
  if(S.miss&&!was){keep();return}
  el.style.setProperty("--p",el.value*5+"%");document.getElementById("o-"+i).firstChild.textContent=el.value;
  const t=total(S.type,d.scores);document.getElementById("tot").textContent=totalText(S.type,t);document.getElementById("lvl").textContent=level(S.type,t)||"คะแนนรวม"}});
document.addEventListener("click",e=>{const b=e.target.closest("button")||e.target.closest("[data-tog]");if(!b)return;const ds=b.dataset,d=S.draft;
 if(S.pf)return;
 if(ds.pf){S.pf=ds.pf;S.pfErr="";keep();return}
 if(ds.d){key(ds.d);return}
 if("out" in ds){S.me=null;ls.set("nra_me",null);go("login",{code:""})}
 else if("home" in ds)home();
 else if(ds.tab)go(role(S.me)==="admin"?"ahome":"thome",{tab:ds.tab});
 else if(ds.rtab)go("rhome",{rtab:ds.rtab});
 else if(ds.hf){S.hf=ds.hf;keep()}
 else if(ds.yr){S.yr=ds.yr;keep()}
 else if(ds.dt){S.dt=ds.dt;keep()}
 else if(ds.pt){S.pt=ds.pt;S.openG=null;keep()}
 else if(ds.person)go("person",{person:ds.person,openG:null});
 else if(ds.self)start("jc",null,ds.self);
 else if(ds.ftype){if(ds.ftype!==S.type){const keepT=d.f.title;start(ds.ftype,null,d.resCode);if(keepT)S.draft.f.title=keepT;render()}}
 else if(ds.job){const r=S.reqs.find(r=>r.id===ds.job);start(r.type,r)}
 else if(ds.open){const r=S.reqs.find(x=>x.id===ds.open);if(r&&role(S.me)==="staff"&&r.status==="done"&&r.assessor===S.me)editDone(r);else go("detail",{open:ds.open,saved:false})}
 else if("unlock" in ds){d.locked=false;keep()}
 else if(ds.chip){if(d&&d.locked)return;S.err="";d.f[ds.chip]=ds.v;keep()}
 else if(ds.sc){if(d.locked)return;S.err="";d.scores[+ds.sc]=ds.v==="NA"?"NA":+ds.v;keep()}
 else if(ds.step){if(HELD){HELD=false;return}bump(+ds.step,+ds.dv)}
 else if(ds.qd){S.qd=S.qd===+ds.qd?null:+ds.qd;keep()}
 else if("fb" in ds){S.fb=true;keep()}
 else if("save" in ds){const F=FORMS[S.type],bad=F.kind==="slider"?d.touched.map((x,i)=>x?0:i+1):d.scores.map((x,i)=>x===null?i+1:0);let m="";
   if(bad.some(Boolean))m="ยังให้คะแนนไม่ครบ (ข้อ "+bad.filter(Boolean).join(", ")+")";
   else{const c=(F.chips||[]).find(([k])=>!d.f[k]);if(c)m="กรุณาเลือก"+c[1]}
   if(m){S.err=m;S.miss=true;keep();const el=document.querySelector(".miss");if(el)el.scrollIntoView({block:"center"});return}
   const id=d.reqId||newId();
   put({id,group:d.group||id,type:S.type,resCode:d.resCode,date:d.date,title:d.f.title||"",assessor:S.me,resName:nameOf(d.resCode),assessorName:nameOf(S.me),status:"done",f:d.f,scores:d.scores,t:d.t,s20:true,doneAt:d.edit&&d.edit.doneAt||new Date().toISOString(),...(d.edit?{editedAt:new Date().toISOString()}:{})});
   go("detail",{open:id,draft:null,saved:true})}
 else if("new" in ds)go("rnew",{nw:{type:"",f:{},date:today(),as:[],res:""}});
 else if(ds.ntype){S.nw.type=ds.ntype;S.err="";keep()}
 else if("nasall" in ds){const all=Object.keys(STAFF);S.nw.as=S.nw.as.length===all.length?[]:all;S.err="";keep()}
 else if(ds.nas){const a=S.nw.as,i=a.indexOf(ds.nas);i<0?a.push(ds.nas):a.splice(i,1);S.err="";keep()}
 else if("send" in ds){const n=S.nw,F=FORMS[n.type];let m="";
   const adm=role(S.me)==="admin",rc=adm?n.res:S.me,back=x=>adm?go("ahome",{nw:null,tab:"pend",...x}):go("rhome",{nw:null,rtab:"list",...x});
   if(adm&&!rc)m="กรุณาเลือกแพทย์ประจำบ้าน";
   else if(!F)m="กรุณาเลือกประเภท";
   else{const h=F.head.find(([k])=>!String(n.f[k]??"").trim());m=h?"กรุณาใส่"+h[1]:!n.as.length?"กรุณาเลือกอาจารย์อย่างน้อย 1 ท่าน":""}
   if(m){S.err=m;keep();return}
   if(S.sending)return;
   n.g=n.g||newId();n.ids=n.ids||{};const g=n.g,f={};F.head.forEach(([k])=>f[k]=n.f[k].trim());
   const rs=n.as.map(c=>({id:n.ids[c]||(n.ids[c]=newId()),group:g,type:n.type,resCode:rc,date:n.date,title:f.title,f:{...f},assessor:c,resName:nameOf(rc),assessorName:nameOf(c),status:"pending",...(adm?{by:S.me}:{})}));
   if(!GAS){rs.forEach(put);back({});return}
   S.sending=true;S.err="";P++;W++;keep();
   call({code:S.me,action:"saveMany",rs}).then(x=>{if(!x||!x.ok||!x.saved)throw 0;rs.forEach(r=>{if(!S.reqs.some(y=>y.id===r.id))S.reqs.push(r)});
     P--;W++;S.sending=false;back({note:"ส่งถึงอาจารย์ "+rs.length+" ท่านเรียบร้อยแล้ว"})})
    .catch(e=>{P--;W++;S.sending=false;if(S.view==="rnew"){S.err="ส่งไม่สำเร็จ กรุณากดส่งอีกครั้ง (กดซ้ำได้ ระบบไม่สร้างใบซ้ำ)";keep()}})}
 else if(ds.del){S.confirm=ds.del;keep()}

   else{put(r);S.note="ขึ้นป้ายแจ้งเตือนในแอปของ "+who+" แล้ว (ต้นแบบนี้ยังไม่ส่งอีเมลหรือ LINE)";keep()}}
 else if(ds.tog){S.openG=S.openG===ds.tog?null:ds.tog;S.adding=null;keep()}
});
